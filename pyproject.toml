[project]
name = "token-monitor"
version = "0.1.0"
description = "Скрининг пулов и ресерч токенов для LP на BSC, Base, Robinhood Chain"
requires-python = ">=3.11"
dependencies = [
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "pycryptodome>=3.20",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["token_monitor*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
